# 策略运行配置 — 每日复盘后更新
# 日期标识：用于确认配置是否已更新到最新
date: "2026-04-02"

strategies:
  # ======================================================
  # 产业趋势突破策略 (暂时禁用)
  # ======================================================
  trend_breakout:
    enabled: false
    phases: ["trading"]
    time_range: ["09:30", "14:57"]
    candidates: []
    params:
      breakout_pct: 0.02
      lookback_ticks: 10
      min_amount: 0

  # ======================================================
  # 竞价强度异动策略 (暂时禁用)
  # ======================================================
  auction_strength:
    enabled: false
    phases: ["auction_open"]
    time_range: null
    candidates: []
    params:
      vol_multiple_threshold: 2.0
      min_bid_ask_ratio: 1.5
      min_open_strength: 0.02

  # ======================================================
  # 冰点修复策略 (暂时禁用)
  # ======================================================
  ice_point_repair:
    enabled: false
    phases: ["trading", "auction_close"]
    time_range: null
    candidates: []
    params:
      min_reversal_pct: 3.0
      min_volume_surge: 2.0

  # ======================================================
  # 竞价涨停加单策略 ★ 新策略
  # ======================================================
  auction_limit_chase:
    enabled: false
    phases: ["auction_open"]             # 仅竞价开盘阶段
    time_range: null                      # 策略内部自行区分 9:20 前后
    candidates:                           # 冰点日稀缺涨停，重点跟踪
      - "600488"   # 津药药业 — 5板破天花板，医药情绪锚
      - "002038"   # 双鹭药业 — 异动7天首板，医药辨识度高，看是否加速
      - "601872"   # 招商轮船 — 美伊战争64亿炸板，看是否有二板
    params:
      seal_threshold: 30000000            # 条件3: 稳态大封阈值 (3000万)
      sudden_increase_threshold: 20000000 # 条件1: 单帧巨量增加阈值 (2000万)
      accel_min_ticks: 3                  # 条件2: 加速判断最少连续递增帧数
      exclude_threshold: 50000000         # 排除: 封单基准值 min(pre920_last, post920_first) 超此值

  # ======================================================
  # 盘面脉搏策略 ★
  # ======================================================
  market_pulse:
    enabled: true
    phases: ["auction_open", "trading"]    # T1(竞价) + T2/T3(交易)
    time_range: null                        # 策略内部按时间点控制
    candidates: []                          # 全市场扫描，无需候选股

  # ======================================================
  # 首板1进2策略 ★ 新策略
  # ======================================================
  first_board_1to2:
    enabled: false
    phases: ["auction_open"]             # 仅竞价开盘阶段
    time_range: null
    candidates: []                        # 留空表示全市场扫描
    params:
      lookback_days: 10                   # 首板前回看天数
      volatility_threshold: 4.0           # 首板前涨跌幅阈值（±4%）
      max_amount_yi: 15.0                 # 最大成交额（亿元）
      auction_amount_ratio_min: 0.10      # 竞价金额比例最小值（1/10）
      auction_amount_ratio_max: 0.125     # 竞价金额比例最大值（1/8）
      min_open_strength: 0.02             # 最小高开幅度（2%）
      top_n: 3                           # 输出TOP N

  # ======================================================
  # 波动率收敛突破策略 ★ 新策略
  # ======================================================
  volatility_contraction:
    enabled: true
    phases: ["trading"]
    time_range: ["09:30", "14:57"]
    candidates: []                        # 留空表示全市场扫描
    params:
      rally_gain_pct: 80.0                # 条件1: 最小拉升幅度(%)
      rally_max_days: 15                  # 条件1: 拉升最大天数
      rally_lookback: 60                  # 条件1: 回看总天数
      ma_proximity: 0.05                  # 条件2: 距MA20的最大偏离(5%)
      vol_expand_multiple: 1.5            # 条件4: 今日振幅/近3日平均振幅的倍数
      volume_ratio: 1.2                   # 条件5: 今日量/5日均量比

  # ======================================================
  # 强更强策略 ★ 新策略
  # ======================================================
  strong_gets_stronger:
    enabled: true
    phases: ["auction_open", "trading"]
    time_range: ["09:15", "10:00"]
    candidates: []                        # 留空表示全市场扫描
    params:
      extreme_days_min: 5                 # 条件1: 近10天涨跌停天数下限
      lookback_days: 10                   # 条件1: 回看天数
      volume_expand_ratio: 1.2            # 条件3: 昨日量/5日均量比
      open_strength_min: 0.09             # 条件4: 开盘涨幅下限(9%)
      limit_approach_pct: 0.99            # 条件5: 接近涨停价的百分比
      limit_approach_by_time: "09:40:00"  # 条件5: 限时

  # ======================================================
  # 最高板板块共振低吸策略 ★ 新策略
  # ======================================================
  highest_board_dip:
    enabled: true
    phases: ["trading"]
    time_range: ["09:30", "14:57"]
    candidates: []                        # 从review数据自动获取最高板
    params:
      one_word_days_min: 2                # 条件2: 一字板最少天数
      cluster_top_n: 100                  # 跌幅聚类取样数
      dip_from_high_pct: 6.0             # 买点1: 从日内高点回撤幅度(%)
      sector_decline_pct: -1.0            # 买点1: 聚类跌幅阈值(%)
      pullback_ratio: 0.98                # 买点2: 回调比例
